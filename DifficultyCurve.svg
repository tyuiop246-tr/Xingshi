<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f7f8fa"/>
  <text x="450" y="34" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#222">醒狮·高桩采青 —— 关卡难度曲线</text>
  <text x="450" y="56" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#666">X轴：关卡距离(m)  Y轴：难度(1-10)　起承转合四段式</text>

  <!-- grid -->
  <g stroke="#dfe3e8" stroke-width="1">
    <line x1="90" y1="90" x2="90" y2="450"/><line x1="240" y1="90" x2="240" y2="450"/>
    <line x1="390" y1="90" x2="390" y2="450"/><line x1="540" y1="90" x2="540" y2="450"/>
    <line x1="690" y1="90" x2="690" y2="450"/><line x1="840" y1="90" x2="840" y2="450"/>
    <line x1="90" y1="450" x2="240" y2="450"/><line x1="90" y1="360" x2="840" y2="360"/>
    <line x1="90" y1="270" x2="840" y2="270"/><line x1="90" y1="180" x2="840" y2="180"/>
    <line x1="90" y1="90" x2="840" y2="90"/>
  </g>
  <!-- y labels -->
  <g font-family="sans-serif" font-size="12" fill="#555" text-anchor="end">
    <text x="82" y="454">0</text><text x="82" y="364">2</text><text x="82" y="274">4</text>
    <text x="82" y="184">6</text><text x="82" y="94">8</text>
  </g>
  <!-- x labels -->
  <g font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">
    <text x="90" y="470">0 起</text><text x="240" y="470">17 承</text>
    <text x="390" y="470">37</text><text x="540" y="470">60 转</text>
    <text x="690" y="470">80</text><text x="840" y="470">92 合</text>
  </g>

  <!-- zone backgrounds -->
  <rect x="90" y="90" width="150" height="360" fill="#e8f5e9" opacity="0.5"/>
  <rect x="240" y="90" width="300" height="360" fill="#e3f2fd" opacity="0.5"/>
  <rect x="540" y="90" width="300" height="360" fill="#fff3e0" opacity="0.6"/>
  <rect x="840" y="90" width="10" height="360" fill="#f3e5f5"/>
  <g font-family="sans-serif" font-size="12" font-weight="bold" fill="#666" text-anchor="middle">
    <text x="165" y="108">起·教学</text><text x="390" y="108">承·静态桩</text>
    <text x="690" y="108">转·移动鼓</text><text x="845" y="108" transform="rotate(-90 845 108)">合</text>
  </g>

  <!-- difficulty curve: 1,1.5,2 then 3,4,4.5,5.5,6,6.5,7 then 8,8.5,9 then 2 -->
  <polyline points="90,415 160,415 240,395 320,360 390,330 460,300 540,270 610,225 690,195 760,165 800,120 830,120 840,405"
    fill="none" stroke="#e53935" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#e53935">
    <circle cx="90" cy="415" r="4"/><circle cx="240" cy="395" r="4"/><circle cx="540" cy="270" r="5"/>
    <circle cx="690" cy="195" r="5"/><circle cx="800" cy="120" r="6"/><circle cx="840" cy="405" r="5"/>
  </g>
  <!-- annotations -->
  <g font-family="sans-serif" font-size="12" fill="#333">
    <text x="100" y="400">熟悉手感</text>
    <text x="250" y="380">间距4m/落差递增</text>
    <text x="550" y="255">首次动态机关</text>
    <text x="700" y="180">速度2.0→3.0+相位错开</text>
    <text x="745" y="105">情绪高潮</text>
    <text x="700" y="430">采青→难度骤降释放</text>
  </g>
  <!-- legend -->
  <g font-family="sans-serif" font-size="12" fill="#555">
    <line x1="100" y1="492" x2="140" y2="492" stroke="#e53935" stroke-width="3"/>
    <text x="148" y="496">难度曲线</text>
    <rect x="260" y="484" width="14" height="14" fill="#e8f5e9"/><text x="280" y="496">教学</text>
    <rect x="340" y="484" width="14" height="14" fill="#e3f2fd"/><text x="360" y="496">静态</text>
    <rect x="420" y="484" width="14" height="14" fill="#fff3e0"/><text x="440" y="496">动态</text>
    <rect x="500" y="484" width="14" height="14" fill="#f3e5f5"/><text x="520" y="496">奖励</text>
  </g>
</svg>
