<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000">
  <rect width="360" height="1000" fill="#f7f8fa"/>
  <text x="180" y="30" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">醒狮·高桩采青 俯视图</text>
  <text x="180" y="50" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#666">正交俯视 · 红线主线 · 黄圈难点 · 蓝虚线捷径</text>

  <!-- Z axis ruler -->
  <line x1="40" y1="90" x2="40" y2="950" stroke="#999" stroke-width="1"/>
  <g font-family="sans-serif" font-size="10" fill="#666" text-anchor="end">
    <text x="35" y="94">0m</text><text x="35" y="240">17m</text><text x="35" y="470">45m</text>
    <text x="35" y="700">70m</text><text x="35" y="930">92m</text>
  </g>

  <!-- START zone: wide plaza -->
  <rect x="90" y="80" width="180" height="130" fill="#e8f5e9" stroke="#81c784" stroke-width="1"/>
  <text x="180" y="100" font-family="sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle">起·教学广场 14×16</text>
  <circle cx="180" cy="150" r="7" fill="#c62828"/>
  <text x="195" y="154" font-family="sans-serif" font-size="10" fill="#333">出生点</text>
  <rect x="170" y="180" width="20" height="8" fill="#a5d6a7"/>
  <rect x="180" y="195" width="20" height="8" fill="#81c784"/>

  <!-- PILES zone -->
  <rect x="90" y="220" width="180" height="290" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1"/>
  <text x="180" y="238" font-family="sans-serif" font-size="11" fill="#1565c0" text-anchor="middle">承·静态梅花桩</text>
  <g fill="#546e7a">
    <circle cx="180" cy="265" r="9"/><circle cx="160" cy="292" r="8.5"/><circle cx="190" cy="319" r="8"/>
    <circle cx="165" cy="346" r="7.5"/><circle cx="205" cy="373" r="7"/><circle cx="150" cy="400" r="6.5"/>
    <circle cx="195" cy="427" r="6"/><circle cx="170" cy="454" r="5.5"/><circle cx="210" cy="481" r="5"/>
    <circle cx="180" cy="500" r="4.5"/>
  </g>
  <!-- shortcut pile -->
  <circle cx="245" cy="520" r="6" fill="#1e88e5"/>
  <text x="255" y="524" font-family="sans-serif" font-size="9" fill="#1565c0">捷径桩</text>

  <!-- DRUMS zone -->
  <rect x="90" y="520" width="180" height="260" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="180" y="538" font-family="sans-serif" font-size="11" fill="#e65100" text-anchor="middle">转·移动鼓阵</text>
  <!-- drum movement ranges (dashed) -->
  <g stroke="#ff9800" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <line x1="120" y1="570" x2="240" y2="570"/><line x1="120" y1="650" x2="240" y2="650"/><line x1="120" y1="730" x2="240" y2="730"/>
  </g>
  <g fill="#8d6e63">
    <circle cx="180" cy="570" r="18"/><circle cx="180" cy="650" r="18"/><circle cx="180" cy="730" r="18"/>
  </g>
  <!-- rest pads -->
  <g fill="#bcaaa4">
    <rect x="168" y="610" width="24" height="10"/><rect x="168" y="690" width="24" height="10"/><rect x="168" y="770" width="24" height="10"/>
  </g>

  <!-- FINISH zone -->
  <rect x="90" y="790" width="180" height="150" fill="#f3e5f5" stroke="#ba68c8" stroke-width="1"/>
  <text x="180" y="808" font-family="sans-serif" font-size="11" fill="#6a1b9a" text-anchor="middle">合·采青高台 10×10</text>
  <rect x="130" y="830" width="100" height="90" fill="#ce93d8"/>
  <circle cx="180" cy="875" r="12" fill="#fbc02d" stroke="#f57f17" stroke-width="2"/>
  <text x="180" y="879" font-family="sans-serif" font-size="9" fill="#5d4037" text-anchor="middle">青</text>
  <!-- spotlight -->
  <circle cx="180" cy="875" r="24" fill="none" stroke="#ffd54f" stroke-width="2" stroke-dasharray="3 3" opacity="0.8"/>

  <!-- MAIN PATH red line -->
  <polyline points="180,150 180,180 190,195 180,265 160,292 190,319 165,346 205,373 150,400 195,427 170,454 210,481 180,500 180,570 180,610 180,650 180,690 180,730 180,770 180,875"
    fill="none" stroke="#d32f2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- SHORTCUT blue dashed -->
  <polyline points="180,500 245,520 180,770" fill="none" stroke="#1976d2" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- difficulty markers (yellow circles) -->
  <g fill="none" stroke="#ffeb3b" stroke-width="3">
    <circle cx="180" cy="195" r="16"/>
    <circle cx="150" cy="400" r="18"/>
    <circle cx="180" cy="570" r="24"/>
    <circle cx="180" cy="730" r="24"/>
  </g>
  <g font-family="sans-serif" font-size="9" fill="#c62828" text-anchor="middle">
    <text x="180" y="225">难点1:首跳</text>
    <text x="180" y="425">难点2:细桩大落差</text>
    <text x="180" y="600">难点3:动态鼓1</text>
    <text x="180" y="760">难点4:动态鼓3</text>
  </g>

  <!-- legend -->
  <g font-family="sans-serif" font-size="10" fill="#555">
    <line x1="60" y1="972" x2="95" y2="972" stroke="#d32f2f" stroke-width="3"/><text x="100" y="975">主线</text>
    <line x1="150" y1="972" x2="185" y2="972" stroke="#1976d2" stroke-width="2.5" stroke-dasharray="5 3"/><text x="190" y="975">捷径</text>
    <circle cx="250" cy="972" r="6" fill="none" stroke="#ffeb3b" stroke-width="2"/><text x="262" y="975">难点</text>
  </g>
</svg>
